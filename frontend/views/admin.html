<div class="container mt-4" ng-controller="AdminController">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin Felület <small class="text-muted">(CRUD)</small></h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#ad">Új macska</button>
    </header>

    <div class="card mb-4 p-4 bg-light">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Név szűrő" ng-model="szures.nev">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Szín szűrő" ng-model="szures.szin">
            </div>
            <div class="col-md-4">
                <div class="input-group">
                    <select class="form-select" style="max-width: 80px;" ng-model="szures.korFeltetel">
                        <option value="==">=</option>
                        <option value=">">></option>
                        <option value=">=">>=</option>
                        <option value="<">&lt;</option>
                        <option value="<=">&lt;=</option>
                        <option value="!=">!=</option>
                    </select>
                    <input type="number" min="0" class="form-control" placeholder="Kor" ng-model="szures.kor">
                </div>
            </div>
        </div>
        <div class="col-md-4" style="padding-top: 8px;">
            <div class="input-group">
                <select class="form-select" style="max-width: 80px;" ng-model="szures.arFeltetel">
                    <option value="==">=</option>
                    <option value=">">></option>
                    <option value=">=">>=</option>
                    <option value="<">&lt;</option>
                    <option value="<=">&lt;=</option>
                    <option value="!=">!=</option>
                </select>
                <input type="number" min="1" class="form-control" placeholder="Ár" ng-model="szures.ar">
            </div>
        </div>
    </div>

    <table class="table table-striped table-hover border shadow-sm">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Név</th>
                <th>Szín</th>
                <th>Kor</th>
                <th>Ár</th>
                <th style="width: 1%;">Műveletek</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="cat in cats | filter: kombinaltSzuro">
                <td>{{cat.id}}</td>
                <td>{{cat.nev}}</td>
                <td>{{cat.szin}}</td>
                <td>{{cat.kor}}</td>
                <td>{{cat.ar}} Ft</td>
                <td class="text-nowrap">
                    <div class="">
                        <button class="btn btn-sm btn-success" ng-click="konfetti(cat)">
                            🎉💨
                        </button>
                        <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#szerkesztLap"
                            ng-click="prepareEdit(cat)">
                            ✏️💨
                        </button>
                        <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#torol"
                            ng-click="prepareDelete(cat)">
                            ❌💨
                        </button>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="modal fade" id="ad" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Új macska</h5>
                </div>
                <div class="modal-body">
                    <form name="newForm">
                        <input type="text" ng-model="newCat.nev" class="form-control mb-2" placeholder="Név" required>
                        <input type="text" ng-model="newCat.szin" class="form-control mb-2" placeholder="Szín" required>
                        <input type="number" ng-model="newCat.kor" class="form-control" placeholder="Kor" min="0" required>
                        <div class="input-group" style="padding-top: 8px;">
                            <input type="number" ng-model="newCat.ar" class="form-control" placeholder="Ár" min="0"
                                required>
                            <span class="input-group-text">Ft</span>
                        </div>
                    </form>
                    <div class="text-center mt-3"><img src="images/generator.gif" class="img-fluid"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" ng-click="addCat()" data-bs-dismiss="modal"
                        ng-disabled="newForm.$invalid">Hozzáad</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="torol" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <p>Biztosan törlöd a <b>{{targetDelete.nev}}t</b>? :(</p>
                    <p><i>(továbbá pert indítunk maga ellen macskák megsemmisítésért)</i></p>
                    <img src="images/explode-cute.gif" class="img-fluid">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger" ng-click="confirmDelete()" data-bs-dismiss="modal">Igen 😿</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="szerkesztLap" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5">Macska szerkesztése</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form name="editForm">
                        <div class="mb-3">
                            <label for="nevsz" class="col-form-label">Név:</label>
                            <input type="text" class="form-control" id="nevsz" ng-model="editableCat.nev" required>
                        </div>
                        <div class="mb-3">
                            <label for="szinsz" class="col-form-label">Szín:</label>
                            <input type="text" class="form-control" id="szinsz" ng-model="editableCat.szin" required>
                        </div>
                        <div class="mb-3">
                            <label for="korsz" class="col-form-label">Kor:</label>
                            <input type="number" class="form-control" id="korsz" ng-model="editableCat.kor" min="0"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="arsz" class="col-form-label">Ár:</label>
                            <input type="number" class="form-control" id="arsz" ng-model="editableCat.ar" min="0"
                                required>
                        </div>
                        <div class="text-center">
                            <img src="images/edit.gif" alt="Szerkesztés" class="img-fluid rounded">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
                    <button id="szerkeszt" type="button" class="btn btn-primary" data-bs-dismiss="modal"
                        ng-click="saveEdit()" ng-disabled="editForm.$invalid">
                        Mentés
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
